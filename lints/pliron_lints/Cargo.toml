[package]
name = "pliron_lints"
version = "0.1.0"
description = "Dylint lints for pliron and code built on it"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "8bfc820881b2cc555cea5383071971bc14e523e5" }
dylint_linting = "6.4"

[dev-dependencies]
dylint_testing = "6.4"
hashbrown = "0.17"
pliron = { path = "../.." }

[[example]]
name = "ui"
path = "ui/main.rs"

[package.metadata.rust-analyzer]
rustc_private = true

# This crate needs a pinned nightly toolchain. It is not a member of the root workspace.
[workspace]
