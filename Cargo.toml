[workspace]
resolver = "2"
members = ["pliron-derive", "pliron-llvm", "pliron-llvm/llvm-opt"]

[package]
name = "pliron"
description = "Programming Languages Intermediate RepresentatiON"
version.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[workspace.package]
version = "0.19.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/pliron-org/pliron"
categories = ["compilers"]
keywords = ["pliron", "llvm", "mlir", "compiler"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
std = ["dep:utf8-chars"]
default = ["std"]

[dependencies]
pliron-derive = { path = "./pliron-derive", version = "=0.19.0" }

awint.workspace = true
rustc_apfloat.workspace = true
rustc-hash.workspace = true
hashbrown.workspace = true
indexmap.workspace = true
smallvec.workspace = true
thiserror.workspace = true
combine.workspace = true
log.workspace = true
hi_sparse_bitset.workspace = true
slotmap.workspace = true
once_vec.workspace = true
downcast-rs.workspace = true
regex.workspace = true
dyn-clone.workspace = true
utf8-chars = { workspace = true, optional = true }

# Only used in `no_std`, but can't express that.
spin = "0.12.3"

[target.'cfg(target_family = "wasm")'.dependencies]
inventory = "0.3.25"
[target.'cfg(not(target_family = "wasm"))'.dependencies]
linkme = "0.3.37"

[dev-dependencies]
expect-test.workspace = true
env_logger.workspace = true
clap.workspace = true
utf8-chars.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
pliron-llvm = { path = "./pliron-llvm" }
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

[workspace.dependencies]
awint = "0.19.0"
bitflags = "2.13.2"
rustc_apfloat = "0.2.3"
assert_cmd = "2.2.2"
clap = { version = "4.6.7", features = ["derive"] }
expect-test = "1.5.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
prettyplease = "0.3.0"
rustc-hash = "2.1.3"
hashbrown = "0.17.1"
indexmap = { version = "2.14.2", default-features = false }
smallvec = { version = "1.16.3", default-features = false }
combine = "4.6.8"
thiserror = "2.0.21"
tempfile = "3.27.0"
log = { version = "0.4.34" }
env_logger = "0.11.11"
cargo-manifest = "0.21.0"
which = "8.0.6"
hi_sparse_bitset = "0.10.0"
utf8-chars = "3.0.7"
slotmap = "1.1.1"
once_vec = "0.4.0"
downcast-rs = "2.0.2"
regex = "1.13.1"
dyn-clone = "1.0.20"

[[example]]
name = "kaleidoscope"
path = "examples/kaleidoscope/main.rs"
test = true
