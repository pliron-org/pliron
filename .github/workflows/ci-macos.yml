name: "CI: Workspace (macOS)"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test (macOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Setup LLVM
      run: |
        brew update
        brew install llvm
        llvm_prefix="$(brew --prefix llvm)"
        llvm_version="$("$llvm_prefix/bin/llvm-config" --version)"
        case "$llvm_version" in
          23.*) ;;
          *) echo "Expected LLVM 23.x, got $llvm_version" >&2; exit 1 ;;
        esac
        echo "LLVM_SYS_231_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
        echo "CLANG_BINARY_PATH=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
        echo "LLI_BINARY_PATH=$llvm_prefix/bin/lli" >> "$GITHUB_ENV"

    - name: Tests (Debug)
      run: RUSTFLAGS="-D warnings" cargo test --workspace --verbose

    - name: Tests (Release)
      run: RUSTFLAGS="-D warnings" cargo test --release --workspace --verbose
