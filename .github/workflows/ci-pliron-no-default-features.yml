name: "CI: pliron (no-default-features)"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test pliron (no-default-features)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Configure apt archive cache directory
      run: |
        mkdir -p ~/.cache/apt-archives
        echo 'Dir::Cache::Archives "'"$HOME"'/.cache/apt-archives";' | sudo tee /etc/apt/apt.conf.d/99-archives-cache

    # Shares the .deb cache with ci.yml / llvm-opt-testsuite.yml (same key).
    - name: Cache LLVM apt packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/apt-archives
        key: llvm-22-apt-archives-${{ runner.os }}

    - name: Setup LLVM
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22 all
        sudo chown -R "$(id -u):$(id -g)" ~/.cache/apt-archives

    # `--all-targets` pulls in pliron-llvm as a dev-dependency and
    # pliron-llvm's default (llvm-sys -> std) feature unifies `std` back on for
    # pliron, even under `--no-default-features`. So those steps don't actually
    # exercise a std-free pliron. Just `--lib` doesn't need dev-dependencies,
    # so it genuinely checks the no_std build.
    - name: Clippy pliron (true no_std lib check) - no default features
      run: cargo clippy -p pliron --lib --no-default-features -- -D warnings

    # Same as the previous one
    - name: Build pliron (true no_std lib check) - no default features
      run: RUSTFLAGS="-D warnings" cargo build -p pliron --lib --no-default-features --verbose

    # Now with all targets
    - name: Clippy pliron - no default features
      run: cargo clippy -p pliron --all-targets --no-default-features -- -D warnings

    - name: Test debug pliron - no default features
      run: RUSTFLAGS="-D warnings" cargo test -p pliron --no-default-features --verbose

    - name: Test release pliron - no default features
      run: RUSTFLAGS="-D warnings" cargo test -p pliron --no-default-features --release --verbose

    - name: Documentation pliron - no default features
      run: RUSTDOCFLAGS="-D warnings" cargo doc -p pliron --no-default-features --verbose
