name: "CI: LLVM-opt Testsuite"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  testsuite:
    name: Run llvm-opt Testsuite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Configure apt archive cache directory
      run: |
        mkdir -p ~/.cache/apt-archives
        echo 'Dir::Cache::Archives "'"$HOME"'/.cache/apt-archives";' | sudo tee /etc/apt/apt.conf.d/99-archives-cache

    # Shares the .deb cache with ci.yml's "Setup LLVM" step (same key)
    - name: Cache LLVM apt packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/apt-archives
        key: llvm-22-apt-archives-${{ runner.os }}

    - name: Setup LLVM
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22 all
        sudo chown -R "$(id -u):$(id -g)" ~/.cache/apt-archives

    - name: Install testsuite dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make git

    - name: Build llvm-opt
      run: cargo build -p llvm-opt --verbose

    - name: Run llvm-opt testsuite
      env:
        CLANG: clang-22
        LLVM_OPT: ${{ github.workspace }}/target/debug/llvm-opt
        LLVM_OPT_WRAPPER: ${{ github.workspace }}/pliron-llvm/llvm-opt/llvm-opt-wrapper.sh
      run: bash pliron-llvm/llvm-opt/tests/testsuite.sh
